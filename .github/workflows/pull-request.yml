name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ inputs.revision || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.revision == '' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        run: printf 'version=%s\n' "$(scripts/check-rust-toolchain.sh --print)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 2026-07-09
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          components: clippy,rustfmt
      - run: scripts/ci.sh
