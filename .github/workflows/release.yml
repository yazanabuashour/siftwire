name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag and revision
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          revision="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$revision" refs/remotes/origin/main
          package_version="$(git show "$revision:crates/siftwire/Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)"
          test -n "$package_version"
          test "${RELEASE_TAG#v}" = "$package_version"
          scripts/validate-release-docs.sh "$RELEASE_TAG"
          {
            echo "revision=$revision"
            echo "version=$package_version"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate exact release revision
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/pull-request.yml
    with:
      revision: ${{ needs.preflight.outputs.revision }}

  build:
    name: Build ${{ matrix.target }}
    needs:
      - preflight
      - validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux_amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux_arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: darwin_amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - name: Resolve Rust toolchain
        id: rust-toolchain
        run: printf 'version=%s\n' "$(scripts/check-rust-toolchain.sh --print)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 2026-07-09
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}
          targets: ${{ matrix.target }}
      - name: Build and smoke-test release binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}" --bin siftwire
          binary="target/${{ matrix.target }}/release/siftwire"
          test "$("$binary" --version)" = "siftwire v$RELEASE_VERSION"
          mkdir dist
          cp "$binary" "dist/siftwire_${RELEASE_VERSION}_${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ needs.preflight.outputs.revision }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble release
    needs:
      - preflight
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ needs.preflight.outputs.revision }}
          path: artifacts
      - name: Collect binaries and repository assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          expected=(
            "siftwire_${RELEASE_VERSION}_darwin_amd64"
            "siftwire_${RELEASE_VERSION}_darwin_arm64"
            "siftwire_${RELEASE_VERSION}_linux_amd64"
            "siftwire_${RELEASE_VERSION}_linux_arm64"
          )
          for asset in "${expected[@]}"; do
            mapfile -t matches < <(find artifacts -type f -name "$asset")
            [[ ${#matches[@]} -eq 1 ]]
            cp "${matches[0]}" "dist/$asset"
          done
          sed "s/__SIFTWIRE_VERSION__/${RELEASE_TAG}/g" install.sh > dist/install.sh
          chmod 755 dist/install.sh
          tar -czf "dist/siftwire_${RELEASE_VERSION}_skill.tar.gz" -C skills/siftwire SKILL.md
          git archive --format=tar.gz --prefix="siftwire_${RELEASE_VERSION}/" \
            -o "dist/siftwire_${RELEASE_VERSION}_source.tar.gz" "$RELEASE_REVISION"
      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: dist/siftwire_${{ needs.preflight.outputs.version }}_sbom.spdx.json
          artifact-name: siftwire_${{ needs.preflight.outputs.version }}_sbom.spdx.json
          upload-release-assets: false
      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          checksum="siftwire_${RELEASE_VERSION}_checksums.txt"
          (
            cd dist
            sha256sum \
              install.sh \
              "siftwire_${RELEASE_VERSION}_darwin_amd64" \
              "siftwire_${RELEASE_VERSION}_darwin_arm64" \
              "siftwire_${RELEASE_VERSION}_linux_amd64" \
              "siftwire_${RELEASE_VERSION}_linux_arm64" \
              "siftwire_${RELEASE_VERSION}_sbom.spdx.json" \
              "siftwire_${RELEASE_VERSION}_skill.tar.gz" \
              "siftwire_${RELEASE_VERSION}_source.tar.gz" \
              > "$checksum"
            sha256sum --check "$checksum"
          )
          test "$(find dist -maxdepth 1 -type f | wc -l)" = 9
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ needs.preflight.outputs.revision }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs:
      - preflight
      - assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_REVISION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.preflight.outputs.revision }}
          path: dist
      - name: Create draft and upload immutable assets
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          expected="$(printf '%s\n' \
            install.sh \
            "siftwire_${RELEASE_VERSION}_checksums.txt" \
            "siftwire_${RELEASE_VERSION}_darwin_amd64" \
            "siftwire_${RELEASE_VERSION}_darwin_arm64" \
            "siftwire_${RELEASE_VERSION}_linux_amd64" \
            "siftwire_${RELEASE_VERSION}_linux_arm64" \
            "siftwire_${RELEASE_VERSION}_sbom.spdx.json" \
            "siftwire_${RELEASE_VERSION}_skill.tar.gz" \
            "siftwire_${RELEASE_VERSION}_source.tar.gz" | jq -R . | jq -cs sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort')"
          test "$actual" = "$expected"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/siftwire_${{ needs.preflight.outputs.version }}_source.tar.gz
          sbom-path: dist/siftwire_${{ needs.preflight.outputs.version }}_sbom.spdx.json
      - name: Publish and verify
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view --json tagName --jq .tagName)" = "$RELEASE_TAG"
