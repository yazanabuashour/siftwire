[workspace]
resolver = "2"
members = ["crates/siftwire"]

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
license = "MIT"

[workspace.lints.rust]
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
assertions_on_result_states = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
default_union_representation = "deny"
disallowed_types = "deny"
empty_drop = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
format_push_string = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
ignore_without_reason = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mixed_read_write_in_expression = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pointer_format = "deny"
precedence_bits = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
too_many_lines = "deny"
try_err = "deny"
unchecked_time_subtraction = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"

[profile.release]
strip = true
lto = "thin"

# Match the published url crate's dependencies when building its source from Git.
[patch."https://github.com/servo/rust-url.git"]
form_urlencoded = { version = "1.2.3", registry = "crates-io" }
idna = { version = "1.1.0", registry = "crates-io" }
percent-encoding = { version = "2.3.2", registry = "crates-io" }
