[package]
name = "siftwire"
version = "0.16.5"
edition.workspace = true
rust-version.workspace = true
description = "Local-first brief runtime for agents"
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/yazanabuashour/siftwire"
publish = false
autolib = false

[dependencies]
anyhow = "1"
email-ui = { git = "https://github.com/yazanabuashour/email-ui.git", rev = "78f04a4ac98f7289936778673ae55b26a477ce5e" }
feed-rs = "3.0"
# Keep feed-rs on the parser that produced existing feed links and markers.
feed-url = { package = "url", version = "=2.5.8" }
fs2 = "0.4"
getrandom = "0.4"
jiff = { version = "1.0.2", default-features = false, features = [
  "static",
  "std",
  "tz-fat",
  "tzdb-bundle-always",
] }
path-clean = "1"
quick-xml = { version = "0.42", features = ["encoding"] }
regex = "1"
ring = "0.17"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.3", default-features = false, features = [
  "gzip",
  "platform-verifier",
  "rustls",
] }
unicode-normalization = "0.1"
# Use a distinct source so Cargo does not unify this with feed-url.
url = { git = "https://github.com/servo/rust-url.git", rev = "ad1c66cbff6e318393d872641e30589ff9687b9c", version = "=2.5.9", features = [
  "serde",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
